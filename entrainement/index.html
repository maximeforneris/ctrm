<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Entraînement · Tle Bac Pro CTRM</title>
<meta name="description" content="Des automatismes contre la montre et les leçons du cours reprises par étapes. Rien n'est envoyé : tout se joue dans le navigateur.">
<meta name="etiquette" content="Entraînement">
<meta name="stockage" content="entrainement : ses records, ses étoiles et le réglage du son">
<style>
/* Entrainement · la feuille.
   Palette du kit web, reprise des simulations du labo : papier, graphite, un seul
   accent. Le jeu tient a la structure — tableau de bord, parcours en
   ligne — et pas a la couleur. Polices du systeme : la page s'ouvre sans
   reseau, depuis une cle ou le poste de la salle. */
:root{
  --fond:#e9e7e3; --carte:#fbfaf9; --carte2:#f2f0ec; --encre:#191a1c; --encre2:#5d5b57;
  --trait:#c9c5bf; --trait2:#dedbd6; --accent:#2c6da6; --accent-doux:#dfe8f1;
  --juste:#2f7a55; --juste-doux:#e2efe7; --faux:#ab432a; --faux-doux:#f5e3dd;
  --ombre:0 1px 2px rgba(25,26,28,.05),0 10px 26px rgba(25,26,28,.07); --r:8px;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"Roboto Mono",monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --fond:#131315; --carte:#1c1d20; --carte2:#232427; --encre:#eceae6; --encre2:#a6a49f;
    --trait:#4a4a4d; --trait2:#333437; --accent:#63a6dd; --accent-doux:#1d2a36;
    --juste:#5cc08d; --juste-doux:#17281f; --faux:#ef7a58; --faux-doux:#34201a;
    --ombre:0 1px 2px rgba(0,0,0,.5),0 12px 32px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --fond:#131315; --carte:#1c1d20; --carte2:#232427; --encre:#eceae6; --encre2:#a6a49f;
  --trait:#4a4a4d; --trait2:#333437; --accent:#63a6dd; --accent-doux:#1d2a36;
  --juste:#5cc08d; --juste-doux:#17281f; --faux:#ef7a58; --faux-doux:#34201a;
  --ombre:0 1px 2px rgba(0,0,0,.5),0 12px 32px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fond);color:var(--encre);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,Arial,sans-serif;font-size:16px;line-height:1.5}
/* La page est un conteneur : la mise en page « telephone » suit la place reellement
   disponible, ecran etroit ou calculatrice ouverte a cote. */
.page{max-width:860px;margin:0 auto;padding:8px 16px 56px;container-type:inline-size}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2,h3{line-height:1.2;margin:0;text-wrap:balance}
a{color:inherit}
button{font:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
noscript p{padding:16px;max-width:60ch}

/* ─────────── Barre, en-tete, pied ─────────── */
.barre{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:48px;margin-bottom:6px}
.lien-retour{text-decoration:none;color:var(--encre2);font-weight:600;font-size:.92rem;padding:10px 0;white-space:nowrap}
.lien-retour:hover{color:var(--encre)}
.bouton-son{font-size:.8rem;font-weight:600;color:var(--encre2);background:none;border:1px solid var(--trait);
  border-radius:999px;padding:6px 12px;cursor:pointer;min-height:36px}
.bouton-son[aria-pressed="true"]{color:var(--encre);border-color:var(--encre2)}
.bouton-calc[aria-pressed="true"]{color:var(--carte);background:var(--encre);border-color:var(--encre)}
.barre .rangee{gap:6px;justify-content:flex-end;flex-wrap:wrap}

/* Le panneau et le pave de la calculatrice sont dans calculette.css, partagee avec les
   sites de classe (option « calculatrice: oui » de SITE.md). */
/* les onglets du panneau, quand la classe a les deux outils */
.outils-onglets{display:flex;border:1px solid var(--trait);border-radius:999px;overflow:hidden}
.outil-onglet{font-size:.8rem;font-weight:650;padding:7px 12px;border:0;background:none;color:var(--encre2);cursor:pointer;min-height:34px}
.outil-onglet[aria-selected="true"]{background:var(--encre);color:var(--carte)}
.outil-onglet[hidden]{display:none}
.form-corps{flex:1;min-height:0;overflow-y:auto;padding:10px 12px 16px;display:flex;flex-direction:column;gap:10px}
.form-corps[hidden],.calc-corps[hidden]{display:none}
/* les annonces se recentrent sur ce qui reste visible quand le panneau est ouvert */
@media (min-width:640px) and (max-width:899px){ body.calc-ouverte .annonces{left:calc((100% - 300px) / 2)} }
@media (min-width:900px){ body.calc-ouverte .annonces{left:calc((100% - 380px) / 2)} }
.entete{padding:4px 0 18px;border-bottom:1px solid var(--trait);margin-bottom:20px}
.surtitre{font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--encre2);font-weight:650;margin:0;
  display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.entete h1{font-size:clamp(1.65rem,5vw,2.3rem);font-weight:750;margin:4px 0 8px;letter-spacing:-.01em}
.chapeau{margin:0;color:var(--encre2);max-width:62ch}
.entete-actions{margin-top:14px}
a.bouton{display:inline-block;text-decoration:none;color:inherit}
.pied{margin-top:36px;padding-top:14px;border-top:1px solid var(--trait);font-size:.84rem;color:var(--encre2)}
.problemes{border:1px solid var(--faux);background:var(--faux-doux);border-radius:var(--r);padding:12px 14px 12px 30px;
  margin:0 0 18px;font-size:.9rem}
.problemes p{margin:0 0 4px -16px}

/* ─────────── Rubriques et cartes ─────────── */
.rubrique{margin:0 0 30px}
.rubrique > h2{font-size:1.15rem;font-weight:700;margin:0 0 4px}
.consigne{margin:0 0 12px;color:var(--encre2);font-size:.93rem;max-width:66ch}
.groupe{font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--encre2);font-weight:700;margin:18px 0 8px;
  padding-bottom:4px;border-bottom:1px solid var(--trait2)}
.consigne + .groupe{margin-top:6px}
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.carte{background:var(--carte);border:1px solid var(--trait2);border-radius:var(--r);box-shadow:var(--ombre);padding:16px}
.carte-lien{display:flex;flex-direction:column;gap:4px;text-decoration:none;color:inherit;
  transition:border-color .15s,transform .15s}
.carte-lien:hover{border-color:var(--encre2);transform:translateY(-1px)}
.titre-carte{font-size:1.1rem;font-weight:700;line-height:1.25}
.detail{font-size:.88rem;color:var(--encre2)}
.carte-pied{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;padding-top:10px;
  border-top:1px dashed var(--trait2);font-size:.86rem}
.carte-lien .titre-carte + .detail{margin-bottom:6px}
.pastille{display:inline-block;font-size:.74rem;font-weight:650;padding:1px 8px;border:1px solid var(--trait);
  border-radius:999px;color:var(--encre2);white-space:nowrap;letter-spacing:0;text-transform:none}
.pastille.accent{border-color:var(--accent);color:var(--accent)}
.record{color:var(--accent);font-weight:700}

/* ─────────── Boutons ─────────── */
.bouton{font-weight:650;font-size:.95rem;padding:10px 16px;border-radius:var(--r);border:1px solid var(--trait);
  background:var(--carte);color:var(--encre);cursor:pointer;min-height:44px;text-decoration:none;
  display:inline-flex;align-items:center;justify-content:center;gap:6px}
.bouton:hover{border-color:var(--encre2)}
.bouton.principal{background:var(--encre);border-color:var(--encre);color:var(--carte)}
.bouton:disabled{opacity:.45;cursor:not-allowed}
.rangee{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* ─────────── Le tableau de bord ─────────── */
.titre-jeu{display:flex;justify-content:space-between;align-items:flex-end;gap:8px 12px;flex-wrap:wrap;margin:0 0 12px}
.titre-jeu h1{font-size:clamp(1.3rem,4.5vw,1.7rem);font-weight:750}
.hud{display:grid;grid-template-columns:auto 1fr auto;gap:10px;margin-bottom:12px}
.hud-etape{grid-template-columns:auto 1fr}
.hud-bloc{background:var(--carte);border:1px solid var(--trait2);border-radius:var(--r);padding:8px 12px;
  display:flex;flex-direction:column;justify-content:center;gap:3px;position:relative;min-width:0}
.hud-nom{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--encre2);font-weight:650;margin:0}
.vies{display:flex;gap:3px}
.coeur svg{width:24px;height:24px;display:block;fill:var(--faux)}
.coeur.perdu svg{fill:none;stroke:var(--trait);stroke-width:1.6}
.coeur.casse svg{animation:casse .55s ease-out}
.temps{font-size:1.5rem;font-weight:650;line-height:1.1}
.jauge{display:block;height:5px;background:var(--trait2);border-radius:3px;overflow:hidden}
.jauge-remplie{display:block;height:100%;background:var(--accent);transform-origin:left;transition:transform .1s linear}
.hud-temps.urgent .temps{color:var(--faux)}
.hud-temps.urgent .jauge-remplie{background:var(--faux)}
.hud-score{align-items:flex-end;text-align:right}
.score-ligne{display:flex;align-items:baseline;gap:8px}
.points{font-size:1.5rem;font-weight:650;line-height:1.1}
.mult{font-size:.9rem;font-weight:700;color:var(--accent);border:1.5px solid var(--accent);border-radius:999px;padding:0 7px;line-height:1.5}
.mult.x1{color:var(--encre2);border-color:var(--trait)}
.pulse{animation:pulse .35s ease-out}
.flotte{position:absolute;right:12px;top:-4px;font-weight:700;color:var(--juste);pointer-events:none;animation:monte .95s ease-out forwards}

/* L'avancement d'une etape */
.pas{list-style:none;display:flex;flex-wrap:wrap;gap:5px;margin:4px 0 0;padding:0}
.pas li{width:26px;height:8px;border-radius:4px;background:var(--trait2)}
.pas li.courant{background:var(--encre2)}
.pas li.ok{background:var(--juste)}
.pas li.ko{background:var(--faux)}

/* ─────────── La question ─────────── */
.zone-question{min-height:320px}
.question{background:var(--carte);border:1px solid var(--trait2);border-top:3px solid var(--encre);border-radius:var(--r);
  box-shadow:var(--ombre);padding:18px 18px 20px}
.question.est-juste{border-top-color:var(--juste)}
.question.est-faux{border-top-color:var(--faux);animation:secoue .35s}
.contexte{margin:0 0 6px;color:var(--encre2);font-size:1rem}
.enonce{margin:0 0 4px;font-size:clamp(1.2rem,4.5cqi,1.5rem);font-weight:650;line-height:1.3}
.enonce .nb{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:clamp(2rem,9cqi,2.9rem);font-weight:650;
  letter-spacing:-.01em;display:inline-block;line-height:1.15}
.demande{margin:0 0 4px;color:var(--encre2)}
/* un petit tableau de donnees dans un enonce : un bilan, un CCTP */
table.donnees{border-collapse:collapse;margin:8px 0 12px;font-size:.92rem;font-weight:400;line-height:1.4;min-width:min(100%,320px)}
table.donnees td,table.donnees th{padding:4px 12px 4px 0;border-bottom:1px solid var(--trait2);text-align:left}
table.donnees td:last-child,table.donnees th:last-child{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;padding-right:0}
table.donnees th{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--encre2);font-weight:650}
.demande b{color:var(--encre);font-family:var(--mono)}
.reponses{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.reponses.longues{grid-template-columns:1fr}
@container (max-width:528px){.reponses.moyennes{grid-template-columns:1fr}}
.reponse{position:relative;min-height:62px;padding:12px 14px 12px 34px;border:1.5px solid var(--trait);border-radius:var(--r);
  background:var(--carte2);color:var(--encre);cursor:pointer;text-align:left;font-size:1rem;font-weight:600;
  display:flex;align-items:center;min-width:0;overflow-wrap:anywhere;transition:border-color .12s,background .12s,transform .08s}
.reponses:not(.longues) .reponse{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:clamp(1rem,4cqi,1.2rem)}
.reponse:hover:not(:disabled){border-color:var(--encre2);background:var(--carte)}
.reponse:active:not(:disabled){transform:scale(.985)}
.reponse:disabled{cursor:default}
.reponse:disabled:not(.juste):not(.faux):not(.attendue){opacity:.5}
.reponse.juste{border-color:var(--juste);background:var(--juste-doux)}
.reponse.faux{border-color:var(--faux);background:var(--faux-doux)}
.reponse.attendue{border-color:var(--juste);border-style:dashed;background:var(--juste-doux)}
.touche{position:absolute;left:11px;top:9px;font:600 .7rem/1 system-ui,sans-serif;color:var(--encre2)}

.saisie{margin-top:16px}
.ligne-saisie{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.champ{flex:1;min-width:0;font-size:1.45rem;padding:10px 12px;border:1.5px solid var(--trait);border-radius:var(--r);
  background:var(--carte2);color:var(--encre)}
.champ:focus{outline:none;border-color:var(--accent);background:var(--carte)}
.champ.juste{border-color:var(--juste);background:var(--juste-doux)}
.champ.faux{border-color:var(--faux);background:var(--faux-doux)}
.unite{font-size:1.15rem;font-weight:600;color:var(--encre2);white-space:nowrap}
.aide{margin:8px 0 0;font-size:.84rem;color:var(--encre2)}
.aide.alerte{color:var(--faux);font-weight:600}

/* Le retour : juste en un mot, faux avec l'erreur nommee et la methode */
.retour:empty{display:none}
.retour{margin-top:16px;padding:12px 14px;border-radius:var(--r);border-left:4px solid var(--trait)}
.retour.juste{background:var(--juste-doux);border-left-color:var(--juste);animation:entre .2s ease-out}
.retour.faux{background:var(--faux-doux);border-left-color:var(--faux);animation:entre .2s ease-out}
.retour p{margin:0 0 8px}
.verdict{font-weight:750;font-size:1.05rem}
.retour.juste .verdict{color:var(--juste);margin:0}
.retour.faux .verdict{color:var(--faux)}
.nom-erreur{color:var(--encre)}
.retour .attendue{display:flex;flex-direction:column;gap:2px}
.attendue .valeur{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:1.2rem;font-weight:700}
.methode{display:flex;flex-direction:column;gap:2px;padding-top:8px;border-top:1px dashed var(--trait)}
.etiquette{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--encre2)}

/* ─────────── Le formulaire : une page imprimable, et un onglet du panneau ─────────── */
.form-actions{display:flex;gap:8px;align-items:stretch;margin:0 0 10px}
.form-filtre{flex:1;min-width:0;width:100%;font:inherit;font-size:1rem;padding:8px 10px;border:1.5px solid var(--trait);
  border-radius:var(--r);background:var(--carte);color:var(--encre)}
.form-filtre:focus{outline:none;border-color:var(--accent)}
.form-sommaire{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 18px}
.form-sommaire button{background:none;cursor:pointer;padding:4px 10px}
.form-sommaire button:hover{border-color:var(--encre2);color:var(--encre)}
.form-groupe{margin:0 0 26px}
.form-groupe[hidden],.form-section[hidden]{display:none}
.form-titre{font-size:1.15rem;font-weight:700;margin:0 0 8px}
h3.form-titre{font-size:.76rem;letter-spacing:.1em;text-transform:uppercase;color:var(--encre2);margin:6px 0 6px;
  padding-bottom:4px;border-bottom:1px solid var(--trait2)}
.form-section{background:var(--carte);border:1px solid var(--trait2);border-radius:var(--r);padding:12px 16px 14px;
  margin:0 0 10px;scroll-margin-top:12px}
.form-entete{display:flex;align-items:baseline;gap:8px;margin:0 0 6px;font-weight:700}
/* une formule par ligne, ses unites a droite ; l'une sous l'autre quand la place manque */
.form-liste{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);margin:0}
.form-liste dt,.form-liste dd{padding:7px 0;border-top:1px dashed var(--trait2)}
.form-liste dt:first-of-type,.form-liste dt:first-of-type + dd{border-top:0}
.form-liste dt{font-size:1.05rem;font-weight:650;font-variant-numeric:tabular-nums;padding-right:14px;overflow-wrap:anywhere}
.form-liste dd{margin:0;font-size:.86rem;color:var(--encre2)}
.form-reperes{margin:8px 0 0;padding:8px 0 0 18px;border-top:1px solid var(--trait2);font-size:.88rem}
.form-reperes li{margin:2px 0}
.form-piege{display:flex;gap:8px;align-items:baseline;margin:10px 0 0;padding:7px 10px;border-left:3px solid var(--faux);
  background:var(--faux-doux);border-radius:0 var(--r) var(--r) 0;font-size:.88rem}
.form-piege .etiquette{color:var(--faux);flex:none}
.form-corps .form-section{padding:10px 12px 12px;box-shadow:none}
.form-corps .form-liste,.form-corps .form-liste dd{display:block}
.form-corps .form-liste dt{padding:6px 0 0}
.form-corps .form-liste dd{border-top:0;padding:0 0 6px}
@container (max-width:528px){
  .form-liste{display:block}
  .form-liste dt{padding:7px 0 0}
  .form-liste dd{border-top:0;padding:1px 0 7px}
}
/* a l'impression : les formules seules, sans barre ni champ, une section jamais coupee */
@media print{
  body{background:#fff;color:#000;padding-right:0!important}
  .barre,.form-actions,.form-sommaire,.calculatrice,.annonces,.pied{display:none!important}
  .page{max-width:none;padding:0}
  .entete{padding-bottom:8px;margin-bottom:12px}
  .form-section{break-inside:avoid;box-shadow:none;border-color:#999}
  .form-titre{break-after:avoid}
  .form-piege{background:none}
}

/* ─────────── Annonces ─────────── */
.annonces{position:fixed;top:12px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;
  gap:6px;z-index:10;pointer-events:none;width:max-content;max-width:calc(100% - 32px)}
.annonce{background:var(--encre);color:var(--carte);padding:10px 16px;border-radius:var(--r);font-weight:650;
  box-shadow:var(--ombre);text-align:center;animation:entre .25s ease-out;transition:opacity .4s,transform .4s}
.annonce.part{opacity:0;transform:translateY(-6px)}

/* ─────────── Fin de partie ─────────── */
.fin{padding-top:4px}
.fin > h1{font-size:clamp(1.8rem,6vw,2.5rem);font-weight:750;margin:4px 0 6px}
.score-final{margin:0 0 4px}
.score-final .mono{font-size:clamp(2.4rem,10vw,3.3rem);font-weight:700;line-height:1}
.unite-score{color:var(--encre2);font-weight:600}
.fin > .record,.fin > .detail{margin:0 0 4px}
.fin .etoiles svg{width:34px;height:34px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:18px 0 24px}
.stat{background:var(--carte);border:1px solid var(--trait2);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.stat .val{font-size:1.35rem;font-weight:650}
.coince{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.coince li{background:var(--carte);border:1px solid var(--trait2);border-left:3px solid var(--faux);border-radius:var(--r);
  padding:10px 14px;display:flex;flex-direction:column;gap:2px}
.coince-tete{display:flex;justify-content:space-between;gap:10px;align-items:baseline}

/* ─────────── Le parcours d'une lecon ─────────── */
.parcours{list-style:none;margin:0 0 16px;padding:0;position:relative}
.parcours::before{content:"";position:absolute;left:21px;top:26px;bottom:26px;width:2px;background:var(--trait)}
.etape{position:relative;margin-bottom:10px}
.etape-lien{display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit}
.noeud-etape{width:44px;height:44px;flex:none;border-radius:50%;border:2px solid var(--trait);background:var(--carte);
  display:grid;place-items:center;font-weight:700;position:relative;z-index:1}
.etape.ouverte .noeud-etape{border-color:var(--encre)}
.etape.faite .noeud-etape{background:var(--accent);border-color:var(--accent);color:#fff}
.etape-texte{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;background:var(--carte);border:1px solid var(--trait2);
  border-radius:var(--r);padding:10px 14px;transition:border-color .15s}
a.etape-lien:hover .etape-texte{border-color:var(--encre2)}
.etape.fermee{opacity:.55}
.etape-titre{font-weight:700}

/* La calculatrice · le panneau et le pave.
   Une seule feuille pour le jeu d'entrainement et pour les sites de classe (option
   « calculatrice: oui » de SITE.md, qui la recopie dans assets/). Les couleurs sont les
   jetons du kit ; l'accent, l'erreur et la chasse fixe ont un repli, parce que les chartes
   les nomment --froid, --chaud et .mono. Sortie de jeu.css le 6 octobre 2026. */
/* le panneau : a droite, par-dessus sur telephone */
.calculatrice{position:fixed;top:0;right:0;bottom:0;width:min(100%,380px);z-index:20;display:flex;flex-direction:column;
  background:var(--carte);border-left:1px solid var(--trait);box-shadow:var(--ombre)}
.calculatrice[hidden]{display:none}
.calc-tete{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 12px;min-height:48px;
  border-bottom:1px solid var(--trait2)}
.calc-corps{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;padding:10px 12px 12px}
.calc-angle{display:flex;gap:0;align-self:flex-start;border:1px solid var(--trait);border-radius:999px;overflow:hidden}
.calc-angle button{font:600 .78rem/1 system-ui,sans-serif;padding:7px 12px;border:0;background:none;color:var(--encre2);cursor:pointer}
.calc-angle button[aria-pressed="true"]{background:var(--encre);color:var(--carte)}
.calc-ecran{flex:1;min-height:96px;overflow-y:auto;background:var(--carte2);border:1px solid var(--trait2);border-radius:var(--r,6px);
  padding:6px 10px;display:flex;flex-direction:column}
.calc-historique{list-style:none;margin:auto 0 0;padding:0}
.calc-historique li{padding:5px 0;border-bottom:1px dashed var(--trait2)}
.calc-historique li:last-child{border-bottom:0}
.calc-expr,.calc-res{display:block;width:100%;border:0;background:none;padding:0;cursor:pointer;color:var(--encre);
  font-family:var(--mono,ui-monospace,Consolas,monospace);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.calc-expr{text-align:left;font-size:.86rem;color:var(--encre2)}
.calc-res{text-align:right;font-size:1.25rem;font-weight:650}
.calc-res.erreur{font-family:system-ui,sans-serif;font-size:.9rem;color:var(--faux,var(--chaud,#ab432a));cursor:default}
.calc-expr:hover,.calc-res:not(.erreur):hover{color:var(--accent,var(--froid,#2c6da6))}

<!-- Le moteur, dans cet ordre : les nombres, les fabriques de questions (le coeur, puis
     une par domaine), la calculatrice, le jeu. -->
<script>/* moteur/nombres.js */
/* Entrainement · les nombres a la francaise, dans les deux sens.
   Ecrire : virgule decimale, espace fine insecable entre les milliers, ecriture
   scientifique au-dela de dix millions ou en deca d'un millieme.
   Lire : ce qu'un eleve tape vraiment — virgule ou point, espaces, 2,5e3,
   2,5 x 10^3, 2,5×10³. */
"use strict";
var Nombres = (function () {
  var FINE = " ", MOINS = "−";
  var VERS_EXPOSANT = { "-": "⁻", "0": "⁰", "1": "¹", "2": "²", "3": "³",
    "4": "⁴", "5": "⁵", "6": "⁶", "7": "⁷", "8": "⁸", "9": "⁹" };
  var DEPUIS_EXPOSANT = {};
  Object.keys(VERS_EXPOSANT).forEach(function (k) { DEPUIS_EXPOSANT[VERS_EXPOSANT[k]] = k; });

  function exposant(n) {
    return String(n).split("").map(function (c) { return VERS_EXPOSANT[c]; }).join("");
  }
  function grouper(entier) { return entier.replace(/\B(?=(\d{3})+(?!\d))/g, FINE); }

  /* x avec au plus `chiffres` chiffres significatifs, zeros de queue retires. */
  function ecrire(x, chiffres) {
    if (x === null || x === undefined || !isFinite(x)) return "—";
    if (chiffres === undefined) chiffres = 3;
    if (x === 0) return "0";
    var signe = x < 0 ? MOINS : "";
    var a = Number(Math.abs(x).toPrecision(chiffres));
    if (a >= 1e-3 && a < 1e7) {
      var dec = Math.max(0, chiffres - 1 - Math.floor(Math.log10(a)));
      var s = a.toFixed(dec);
      if (s.indexOf(".") >= 0) s = s.replace(/0+$/, "").replace(/\.$/, "");
      var p = s.split(".");
      return signe + grouper(p[0]) + (p[1] ? "," + p[1] : "");
    }
    var e = Math.floor(Math.log10(a));
    var m = Number((a / Math.pow(10, e)).toPrecision(chiffres));
    if (m >= 10) { m = Number((m / 10).toPrecision(chiffres)); e += 1; }
    return signe + String(m).replace(".", ",") + " × 10" + exposant(e);
  }

  /* Toujours en ecriture decimale, sans notation scientifique : 0,000 047 et non
     4,7 × 10⁻⁵. Pour le CAP et la seconde, ou la virgule est l'exercice. */
  function ecrireDecimal(x) {
    if (x === null || x === undefined || !isFinite(x)) return "\u2014";
    var s = Math.abs(Number(x.toPrecision(12))).toFixed(10).replace(/0+$/, "").replace(/\.$/, "");
    var p = s.split(".");
    return (x < 0 ? MOINS : "") + grouper(p[0]) + (p[1] ? "," + p[1] : "");
  }

  /* NaN si la saisie n'est pas un nombre. */
  function lire(texte) {
    if (texte === null || texte === undefined) return NaN;
    var t = String(texte)
      .replace(/[\s  ]/g, "")
      .replace(/,/g, ".")
      .replace(/[−–]/g, "-")
      .replace(/[⁻⁰¹²³⁴-⁹]+/g, function (s) {
        return "^" + s.split("").map(function (c) { return DEPUIS_EXPOSANT[c]; }).join("");
      })
      .replace(/[×xX*·]/g, "*");
    if (t === "") return NaN;
    if (/^[+-]?(\d+\.?\d*|\.\d+)e[+-]?\d+$/i.test(t)) return Number(t);
    var m = t.match(/^([+-]?(?:\d+\.?\d*|\.\d+))?(?:(?:\*10\^?|10\^)\(?([+-]?\d+)\)?)?$/);
    if (!m || (m[1] === undefined && m[2] === undefined)) return NaN;
    var mantisse = m[1] !== undefined ? Number(m[1]) : 1;
    return m[2] !== undefined ? Number(mantisse + "e" + m[2]) : mantisse;
  }

  /* a vaut b a `tolerance` pres, en relatif. */
  function proche(a, b, tolerance) {
    if (b === 0) return Math.abs(a) < 1e-12;
    return Math.abs(a - b) <= (tolerance || 1e-9) * Math.abs(b);
  }

  return { ecrire: ecrire, ecrireDecimal: ecrireDecimal, lire: lire, proche: proche };
})();

</script>
<script>/* moteur/generateurs.js */
/* Entrainement · les fabriques de questions.

   Une fabrique recoit sa definition, tiree du fichier de la classe, et un niveau de
   1 a 3. Elle rend une question : un contexte, un enonce, l'unite attendue, la valeur
   juste et sa tolerance, la methode, et les erreurs reelles qu'elle sait reconnaitre,
   chacune nommee et expliquee.

   Ces erreurs servent deux fois : elles font les propositions fausses du choix
   multiple, et elles diagnostiquent une saisie libre. Aucune proposition n'est donc
   tiree au hasard : chaque mauvaise reponse est une faute qu'un eleve fait vraiment.

   Apres une erreur, la page nomme l'erreur, donne la bonne reponse et rappelle la
   methode.

   Ajouter une sorte de question = ecrire une fabrique ici, avec definir(). */
"use strict";
var Generateurs = (function () {
  var N = Nombres;
  var fabriques = {};
  var H = 3600;

  function definir(nom, fabrique) { fabriques[nom] = fabrique; }
  function existe(nom) { return typeof fabriques[nom] === "function" || typeof suites[nom] === "function"; }

  /* Une SUITE fabrique plusieurs questions sur les memes donnees : un batiment tire au
     sort, puis sa paroi, son bilan, sa facture. C'est le probleme long du controle,
     avec des nombres neufs a chaque partie. */
  var suites = {};
  function definirSuite(nom, fabrique) { suites[nom] = fabrique; }
  function estSuite(nom) { return typeof suites[nom] === "function"; }

  /* ─────────── le hasard ─────────── */
  function entier(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
  function un(t) { return t[Math.floor(Math.random() * t.length)]; }
  function melanger(t) {
    t = t.slice();
    for (var i = t.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)), x = t[i]; t[i] = t[j]; t[j] = x;
    }
    return t;
  }
  function net(x) { return Number(Number(x).toPrecision(12)); }
  /* [min, max, pas] : un multiple du pas, bornes comprises. */
  function plage(p) {
    var pas = p[2] || 1, n = Math.round((p[1] - p[0]) / pas);
    return net(p[0] + pas * entier(0, n));
  }
  function valeurDe(sit) {
    if (sit.valeurs) return un(sit.valeurs);
    return typeof sit.valeur === "number" ? sit.valeur : plage(sit.valeur);
  }

  /* ─────────── les erreurs : tri, et l'erreur de repli ─────────── */
  var DECALAGE = {
    nom: "Décalage de virgule",
    explication: "Le calcul est le bon, pas la puissance de dix. Recomptez les rangs d'une unité à l'autre."
  };
  /* Retire les erreurs qui tombent juste, les doublons et celles qui s'affichent
     pareil ; complete par des decalages de virgule s'il en reste moins de trois. */
  function ranger(reponse, erreurs, arrondi, decimale) {
    /* deux valeurs qui s'afficheraient pareil ne peuvent pas etre proposees ensemble */
    function cle(x) {
      if (arrondi !== undefined) return Number(x).toFixed(arrondi);
      if (!decimale) return N.ecrire(x, 4);
      return Math.abs(x - Number(Number(x).toFixed(6))) > 1e-9 ? Number(x).toFixed(3) : String(Number(Number(x).toPrecision(12)));
    }
    var gardees = [], vues = [cle(reponse)];
    function essayer(e) {
      if (!isFinite(e.valeur) || e.valeur === 0) return;
      var s = cle(e.valeur);
      if (vues.indexOf(s) >= 0 || N.proche(e.valeur, reponse, 0.03)) return;
      for (var i = 0; i < gardees.length; i++) if (N.proche(e.valeur, gardees[i].valeur, 0.03)) return;
      vues.push(s);
      gardees.push(e);
    }
    erreurs.forEach(essayer);
    [1, -1, 3, -3, 2, -2].forEach(function (k) {
      if (gardees.length < 3)
        essayer({ valeur: net(reponse * Math.pow(10, k)), nom: DECALAGE.nom, explication: DECALAGE.explication });
    });
    return gardees;
  }

  function finir(q) {
    if (q.type === "choix") return q;
    q.type = "nombre";
    q.tolerance = q.tolerance || 0.01;
    q.erreurs = ranger(q.reponse, q.erreurs || [], q.arrondi, q.decimale);
    return q;
  }
  function produire(spec, niveau) {
    niveau = Math.max(1, Math.min(3, niveau || 1));
    var q = fabriques[spec.nom](spec, niveau);
    if (spec.decimale && q.type !== "choix") q.decimale = true;   /* ecriture decimale pleine, sans 10ⁿ */
    return finir(q);

  function produireSuite(spec) { return suites[spec.nom](spec).map(finir); }
  /* Une erreur nommee, sur un modele partage : err(valeur, { nom, explication }) */
  function err(valeur, modele) { return { valeur: valeur, nom: modele.nom, explication: modele.explication }; }

  /* ═══════════════════════════════════════════ BANQUE
     Des questions de cours ecrites a la main, tirees au hasard sans remise :
     { nom: "banque", questions: [ { type: "choix", ... } ] }. Elles se melent aux
     calculs dans le contre-la-montre. */
  definir("banque", function (spec) {
    if (!spec._pioche || !spec._pioche.length) spec._pioche = melanger(spec.questions);
    var q = spec._pioche.pop(), copie = {};
    for (var k in q) copie[k] = q[k];

  });

  /* ═══════════════════════════════════════════ LES UNITES
     f : facteur vers l'unite de base de la famille.
     t : la part du temps dans f (1 h = 3 600 s), pour reconnaitre l'oubli de l'heure.
     cote : le cote du cube en metres, pour reconnaitre l'oubli du cube. */
  var UNITES = {
    /* pression, en pascals */
    "Pa": { fam: "pression", f: 1 },
    "hPa": { fam: "pression", f: 100 },
    "kPa": { fam: "pression", f: 1e3 },
    "MPa": { fam: "pression", f: 1e6 },
    "mbar": { fam: "pression", f: 100 },
    "bar": { fam: "pression", f: 1e5 },
    "mCE": { fam: "pression", f: 9810, repere: "1 mCE = 9 810 Pa ≈ 10 kPa, et 1 bar ≈ 10 mCE." },
    /* volume, en metres cubes */
    "m³": { fam: "volume", f: 1, cote: 1, cube: true },
    "dm³": { fam: "volume", f: 1e-3, cote: 0.1, cube: true },
    "cm³": { fam: "volume", f: 1e-6, cote: 0.01, cube: true },
    "hL": { fam: "volume", f: 0.1 },
    "L": { fam: "volume", f: 1e-3, cote: 0.1, repere: "1 L = 1 dm³, et 1 m³ = 1 000 L." },
    "mL": { fam: "volume", f: 1e-6, cote: 0.01 },
    /* debit volumique, en m³/s */
    "m³/s": { fam: "debit", f: 1, t: 1 },
    "m³/h": { fam: "debit", f: 1 / H, t: 1 / H },
    "L/s": { fam: "debit", f: 1e-3, t: 1 },
    "L/min": { fam: "debit", f: 1e-3 / 60, t: 1 / 60 },
    "L/h": { fam: "debit", f: 1e-3 / H, t: 1 / H },
    /* energie, en joules */
    "J": { fam: "energie", f: 1, t: 1 },
    "kJ": { fam: "energie", f: 1e3, t: 1 },
    "MJ": { fam: "energie", f: 1e6, t: 1 },
    "GJ": { fam: "energie", f: 1e9, t: 1 },
    "Wh": { fam: "energie", f: H, t: H, repere: "1 Wh = 3 600 J : un watt pendant une heure." },
    "kWh": { fam: "energie", f: 1e3 * H, t: H, repere: "1 kWh = 3,6 MJ." },
    "MWh": { fam: "energie", f: 1e6 * H, t: H },
    /* longueur, en metres */
    "km": { fam: "longueur", f: 1e3 },
    "m": { fam: "longueur", f: 1 },
    "dm": { fam: "longueur", f: 0.1 },
    "cm": { fam: "longueur", f: 0.01 },
    "mm": { fam: "longueur", f: 1e-3 },
    /* aire, en metres carres ; cote : le cote du carre, pour reconnaitre l'aire convertie comme une longueur */
    "km²": { fam: "aire", f: 1e6, cote: 1e3, carre: true },
    "ha": { fam: "aire", f: 1e4, cote: 100, carre: true, repere: "1 ha = 10 000 m² : un carré de 100 m de côté." },
    "m²": { fam: "aire", f: 1, cote: 1, carre: true },
    "dm²": { fam: "aire", f: 1e-2, cote: 0.1, carre: true },
    "cm²": { fam: "aire", f: 1e-4, cote: 0.01, carre: true },
    "mm²": { fam: "aire", f: 1e-6, cote: 1e-3, carre: true },
    /* masse, en kilogrammes */
    "t": { fam: "masse", f: 1e3 },
    "kg": { fam: "masse", f: 1 },
    "g": { fam: "masse", f: 1e-3 },
    "mg": { fam: "masse", f: 1e-6 },
    /* vitesse, en m/s */
    "m/s": { fam: "vitesse", f: 1, t: 1 },
    "km/h": { fam: "vitesse", f: 1 / 3.6, t: 1 / H, repere: "1 m/s = 3,6 km/h : 3 600 s dans une heure, 1 000 m dans un kilomètre." },
    /* puissance, en watts */
    "W": { fam: "puissance", f: 1 },
    "kW": { fam: "puissance", f: 1e3 },
    "MW": { fam: "puissance", f: 1e6 },
    /* les prefixes de l'electronique et du numerique */
    "Ω": { fam: "resistance", f: 1 },
    "kΩ": { fam: "resistance", f: 1e3 },
    "MΩ": { fam: "resistance", f: 1e6 },
    "A": { fam: "intensite", f: 1 },
    "mA": { fam: "intensite", f: 1e-3 },
    "µA": { fam: "intensite", f: 1e-6 },
    "V": { fam: "tension", f: 1 },
    "mV": { fam: "tension", f: 1e-3 },
    "kV": { fam: "tension", f: 1e3 },
    "Hz": { fam: "frequence", f: 1 },
    "kHz": { fam: "frequence", f: 1e3 },
    "MHz": { fam: "frequence", f: 1e6 },
    "GHz": { fam: "frequence", f: 1e9 },
    "F": { fam: "capacite", f: 1 },
    "mF": { fam: "capacite", f: 1e-3 },
    "µF": { fam: "capacite", f: 1e-6 },
    "nF": { fam: "capacite", f: 1e-9 },
    "pF": { fam: "capacite", f: 1e-12 },
    "o": { fam: "donnees", f: 1 },
    "ko": { fam: "donnees", f: 1e3 },
    "Mo": { fam: "donnees", f: 1e6 },
    "Go": { fam: "donnees", f: 1e9 },
    "To": { fam: "donnees", f: 1e12 },
    "bit/s": { fam: "debit-num", f: 1 },
    "kbit/s": { fam: "debit-num", f: 1e3 },
    "Mbit/s": { fam: "debit-num", f: 1e6 },
    "Gbit/s": { fam: "debit-num", f: 1e9 }
  };

  function puissanceDeDix(r) { var l = Math.log10(Math.abs(r)); return Math.abs(l - Math.round(l)) < 1e-9; }
  /* 1 : trois rangs au plus · 2 : plus de trois rangs, ou un facteur a connaitre
     (3,6 ; 9 810 ; 60) · 3 : l'heure ET une puissance de dix a la fois. */
  function difficulte(de, vers) {
    var U = UNITES[de], V = UNITES[vers], r = U.f / V.f;
    if (puissanceDeDix(r)) return Math.abs(Math.round(Math.log10(r))) <= 3 ? 1 : 2;
    var tU = U.t || 1, tV = V.t || 1;
    return tU !== tV && !N.proche(r * tV / tU, 1, 1e-9) ? 3 : 2;
  }
  function ciblesDe(sit) {
    var U = UNITES[sit.unite];
    var c = sit.vers || Object.keys(UNITES).filter(function (u) { return UNITES[u].fam === U.fam; });
    return c.filter(function (u) { return u !== sit.unite && UNITES[u] && UNITES[u].fam === U.fam; });
  }
  /* Au niveau demande le plus souvent, en dessous sinon ; jamais au-dessus s'il y a le choix. */
  function choisirCible(de, cibles, niveau) {
    var au = cibles.filter(function (u) { return difficulte(de, u) === niveau; });
    var sous = cibles.filter(function (u) { return difficulte(de, u) < niveau; });
    if (au.length && (!sous.length || Math.random() < 0.65)) return un(au);
    if (sous.length) return un(sous);
    var min = Math.min.apply(null, cibles.map(function (u) { return difficulte(de, u); }));
    return un(cibles.filter(function (u) { return difficulte(de, u) === min; }));
  }
  function h60(t) { return t === H ? 60 : (t === 1 / H ? 1 / 60 : t); }

  /* ═══════════════════════════════════════════ CONVERSION
     { nom: "conversion", situations: [ { texte, unite, valeur: [min, max, pas]
       ou valeurs: [...], vers: [unites d'arrivee] } ] } */
  definir("conversion", function (spec, niveau) {
    var jouables = spec.situations.filter(function (s) {
      return ciblesDe(s).some(function (u) { return difficulte(s.unite, u) <= niveau; });
    });
    var sit = un(jouables.length ? jouables : spec.situations);
    var de = sit.unite, U = UNITES[de];
    var vers = choisirCible(de, ciblesDe(sit), niveau), V = UNITES[vers];
    var v = valeurDe(sit), r = net(U.f / V.f), juste = net(v * r);
    var tU = U.t || 1, tV = V.t || 1;

    var erreurs = [{
      valeur: v / r, nom: "Sens inversé",
      explication: "Vous avez divisé au lieu de multiplier, ou l'inverse. Vers une unité plus petite, le nombre grandit."
    }];
    if (tU !== tV) {
      erreurs.push({ valeur: juste * tV / tU, nom: "Le temps oublié",
        explication: "L'unité de temps se convertit aussi : 1 h = 3 600 s, 1 min = 60 s." });
      if (h60(tU) !== tU || h60(tV) !== tV)
        erreurs.push({ valeur: juste * (tV / tU) * (h60(tU) / h60(tV)), nom: "60 au lieu de 3 600",
          explication: "60 convertit des minutes en secondes ; une heure compte 3 600 secondes." });
    }
    if ((U.carre || V.carre) && U.cote && V.cote)

        explication: "Une aire compte deux rangs par préfixe : 1 m² = 100 dm² = 10 000 cm²." });
    if ((U.cube || V.cube) && U.cote && V.cote)
      erreurs.push({ valeur: v * U.cote / V.cote, nom: "Unité au cube",
        explication: "Au cube, chaque rang compte trois chiffres : 1 m³ = 1 000 dm³ et 1 dm³ = 1 000 cm³." });
    if (de === "mCE" || vers === "mCE") {
      var f = function (u) { return u === "mCE" ? 1000 : UNITES[u].f; };
      erreurs.push({ valeur: v * f(de) / f(vers), nom: "1 mCE pris pour 1 kPa",

    }
    melanger([1, -1, 2, -2, 3, -3]).forEach(function (k) {
      erreurs.push({ valeur: juste * Math.pow(10, k), nom: DECALAGE.nom, explication: DECALAGE.explication });
    });

    var methode = r >= 1
      ? "1 " + de + " = " + N.ecrire(r, 4) + " " + vers + " : on multiplie par " + N.ecrire(r, 4) + "."
      : "1 " + vers + " = " + N.ecrire(1 / r, 4) + " " + de + " : on divise par " + N.ecrire(1 / r, 4) + ".";
    var reperes = [];
    [U.repere, V.repere, tU !== tV ? "1 h = 3 600 s." : null].forEach(function (x) {
      if (x && reperes.indexOf(x) < 0) reperes.push(x);
    });
    if (reperes.length) methode += " " + reperes.join(" ");

    return {
      contexte: sit.texte,
      enonce: '<span class="nb">' + N.ecrire(v, 6) + " " + de + "</span>",
      unite: vers, reponse: juste,
      tolerance: puissanceDeDix(r) ? 1e-6 : 0.02,
      methode: methode, erreurs: erreurs
    };
  });

  /* ═══════════════════════════════════════════ DEBIT D'UN RESEAU D'EAU
     P = Q × 1 163 × ΔT, P en W, Q en m³/h, ΔT en K — la formule de J1 et J7.

  var FAUX_4185 = { nom: "4 185 au lieu de 1 163",
    explication: "4 185 J/(kg·K) va avec un débit massique en kg/s. Avec un débit en m³/h, le coefficient est 1 163." };
  definir("debit-eau", function (spec, niveau) {
    var reg = un(spec.regimes || REGIMES), dt = reg.dt;
    var regime = "régime " + reg.nom + ", soit ΔT = " + dt + " K";
    var methode = "Q = P / (1 163 × ΔT), avec P en W, Q en m³/h et ΔT en K.";
    var cas = niveau === 1 ? "radiateur" : niveau === 2 ? "chaufferie" : un(["litres", "puissance", "ecart"]);
    var P, Q, kW, k;

    if (cas === "radiateur" || cas === "litres") {
      P = plage([500, 3000, 100]); Q = P / (1163 * dt); k = cas === "litres" ? 1000 : 1;
      var e = [
        { valeur: k * P * 1163 * dt, nom: "Multiplié au lieu de diviser",
          explication: "La puissance est donnée, le débit se cherche : P se divise par 1 163 × ΔT." },
        { valeur: k * P / 1163 * dt, nom: "Parenthèses oubliées",
          explication: "P ÷ 1 163 × ΔT multiplie par ΔT. À la calculatrice : P ÷ (1 163 × ΔT)." },
        { valeur: k * P / (4185 * dt), nom: FAUX_4185.nom, explication: FAUX_4185.explication },
        { valeur: k * P / 1163, nom: "ΔT oublié", explication: "L'écart départ / retour divise lui aussi." }
      ];
      if (k === 1000) e.unshift({ valeur: Q, nom: "Resté en m³/h", explication: "La formule donne des m³/h ; 1 m³ = 1 000 L." });
      return {
        contexte: "Un radiateur de " + N.ecrire(P) + " W, " + regime + ".",
        enonce: "Le débit d'eau qui l'alimente ?", unite: k === 1000 ? "L/h" : "m³/h",
        reponse: Q * k, tolerance: 0.03,
        methode: k === 1000 ? methode + " Puis 1 m³ = 1 000 L." : methode, erreurs: e
      };
    }
    if (cas === "chaufferie") {
      kW = plage([30, 400, 10]); Q = kW * 1000 / (1163 * dt);
      return {
        contexte: "Une chaufferie de " + N.ecrire(kW) + " kW, " + regime + ".",
        enonce: "Le débit du circuit ?", unite: "m³/h", reponse: Q, tolerance: 0.03, methode: methode,
        erreurs: [
          { valeur: kW / (1163 * dt), nom: "P laissée en kW", explication: "La formule attend des watts : 1 kW = 1 000 W." },
          { valeur: kW * 1000 * 1163 * dt, nom: "Multiplié au lieu de diviser",
            explication: "La puissance est donnée, le débit se cherche : P se divise par 1 163 × ΔT." },
          { valeur: kW * 1000 / 1163 * dt, nom: "Parenthèses oubliées",
            explication: "P ÷ 1 163 × ΔT multiplie par ΔT. À la calculatrice : P ÷ (1 163 × ΔT)." },
          { valeur: kW * 1000 / (4185 * dt), nom: FAUX_4185.nom, explication: FAUX_4185.explication }
        ]
      };
    }
    if (cas === "puissance") {
      Q = plage([0.5, 12, 0.5]); kW = Q * 1163 * dt / 1000;
      return {
        contexte: "Un circuit débite " + N.ecrire(Q) + " m³/h, " + regime + ".",
        enonce: "La puissance qu'il transporte ?", unite: "kW", reponse: kW, tolerance: 0.03,
        methode: "P = Q × 1 163 × ΔT donne des watts, avec Q en m³/h et ΔT en K ; puis 1 kW = 1 000 W.",
        erreurs: [
          { valeur: kW * 1000, nom: "Resté en watts", explication: "La formule donne des watts ; 1 kW = 1 000 W." },
          { valeur: Q / (1163 * dt), nom: "Divisé au lieu de multiplier",
            explication: "Le débit est donné, la puissance se cherche : P = Q × 1 163 × ΔT." },
          { valeur: Q * 1163 / 1000, nom: "ΔT oublié", explication: "La puissance croît avec l'écart départ / retour." },
          { valeur: Q * 4185 * dt / 1000, nom: FAUX_4185.nom, explication: FAUX_4185.explication }
        ]

    Q = plage([1, 10, 0.5]);

      enonce: "L'écart départ / retour ?", unite: "K", reponse: kW * 1000 / (1163 * Q), tolerance: 0.03,
      methode: "ΔT = P / (1 163 × Q), avec P en W et Q en m³/h.",
      erreurs: [
        { valeur: kW / (1163 * Q), nom: "P laissée en kW", explication: "La formule attend des watts : 1 kW = 1 000 W." },
        { valeur: 1163 * Q / (kW * 1000), nom: "Formule renversée",
          explication: "Partir de P = Q × 1 163 × ΔT et isoler ΔT : on divise P par 1 163 × Q." },
        { valeur: kW * 1000 / 1163 * Q, nom: "Parenthèses oubliées",
          explication: "P ÷ 1 163 × Q multiplie par Q. À la calculatrice : P ÷ (1 163 × Q)." },
        { valeur: kW * 1000 / (4185 * Q), nom: FAUX_4185.nom, explication: FAUX_4185.explication }
      ]
    };
  });

  /* ═══════════════════════════════════════════ VITESSE DE L'EAU DANS UN TUBE
     v = Q / (0,36 × S), Q en m³/h, S en cm², v en m/s — la formule de J7.
     Niveau 1 : la section donnee · 2 : le diametre donne · 3 : le debit maximal. */
  var TUBES = [12, 14, 16, 20, 26, 32];   /* diametres interieurs, en mm */
  definir("vitesse-eau", function (spec, niveau) {
    var methode = "v = Q / (0,36 × S), avec Q en m³/h, S en cm² et v en m/s.";
    var d, Q, S, Sexacte, v;
    for (var essai = 0; essai < 80; essai++) {
      d = un(TUBES); Q = plage([0.1, 4, 0.05]);

    var M2 = { nom: "Section passée en m²",
      explication: "La formule de la séance attend des cm² : le 0,36 contient déjà la conversion." };

    if (niveau === 1) return {
      contexte: "Un débit de " + N.ecrire(Q) + " m³/h dans un tube de " + N.ecrire(S) + " cm² de section intérieure.",
      enonce: "La vitesse de l'eau ?", unite: "m/s", reponse: v, tolerance: 0.03, methode: methode,
      erreurs: [
        { valeur: Q / S, nom: OUBLI.nom, explication: OUBLI.explication },
        { valeur: Q * 0.36 / S, nom: "0,36 au numérateur", explication: "0,36 multiplie la section, au dénominateur." },
        { valeur: Q / (0.36 * S * 1e-4), nom: M2.nom, explication: M2.explication },
        { valeur: Q / (3600 * S), nom: "3 600 au lieu de 0,36",
          explication: "0,36 vaut déjà 3 600 secondes divisées par 10 000 cm² par m²." }
      ]
    };
    if (niveau === 2) {
      v = Q / (0.36 * Sexacte);
      return {
        contexte: "Un débit de " + N.ecrire(Q) + " m³/h dans un tube de " + d + " mm de diamètre intérieur.",
        enonce: "La vitesse de l'eau ?", unite: "m/s", reponse: v, tolerance: 0.03,
        methode: methode + " Et S = π × d² / 4, avec d en cm.",
        erreurs: [
          { valeur: v / 100, nom: "Diamètre laissé en mm", explication: "La section se veut en cm² : le diamètre se passe en cm d'abord." },
          { valeur: v / 4, nom: "Rayon et diamètre confondus", explication: "S = π × d² / 4 avec le diamètre, ou π × r² avec le rayon." },
          { valeur: v * 0.36, nom: OUBLI.nom, explication: OUBLI.explication },
          { valeur: v * 1e4, nom: M2.nom, explication: M2.explication }

      contexte: "Un tube de " + N.ecrire(S) + " cm² de section intérieure, dans un logement : vitesse limitée à 1 m/s.",
      enonce: "Le débit maximal ?", unite: "m³/h", reponse: 0.36 * S, tolerance: 0.03,
      methode: "Q = 0,36 × S × v, avec S en cm², v en m/s et Q en m³/h.",
      erreurs: [

    var R_SUR_I = { nom: "R divisé par I", explication: "La tension est un produit : U = R × I." };
    var I_SUR_R = { nom: "I divisé par R", explication: "La tension est un produit : U = R × I." };

        R = un([10, 20, 50, 100, 200, 500, 1000]); I = un([0.01, 0.02, 0.05, 0.1, 0.2, 0.5, 1, 2]);

        enonce: "La tension à ses bornes ?", unite: "V", reponse: U, tolerance: 0.01, methode: methode,
        erreurs: [

          { valeur: mA / 1000 / R, nom: I_SUR_R.nom, explication: I_SUR_R.explication }
        ]

    }
    cas = un(["courant", "kohm"]);
    if (cas === "courant") {

      return {
        contexte: "U = " + N.ecrire(U) + " V aux bornes d'une résistance de " + R + " Ω.",
        enonce: "Le courant qui la traverse ?", unite: "mA", reponse: U / R * 1000, tolerance: 0.02,
        methode: "I = U / R, avec U en V et R en Ω, donne des ampères ; puis 1 A = 1 000 mA.",
        erreurs: [
          { valeur: U / R, nom: "Resté en ampères", explication: "U / R donne des ampères ; 1 A = 1 000 mA." },
          { valeur: R / U, nom: "R divisé par U", explication: "I = U / R : la tension au numérateur." },
          { valeur: U * R, nom: "U multiplié par R", explication: "I = U / R : on divise." }

    }
    for (i = 0; i < 60; i++) {
      R = un([1, 2.2, 3.3, 4.7, 10]); mA = un([0.5, 1, 2, 3, 5]);
      U = net(R * mA); if (U >= 0.5 && U <= 30) break;

      enonce: "La tension à ses bornes ?", unite: "V", reponse: U, tolerance: 0.01,
      methode: methode + " 1 kΩ = 1 000 Ω et 1 mA = 0,001 A.",
      erreurs: [
        { valeur: R * 1000 * mA, nom: "mA non convertis", explication: "1 mA = 0,001 A : on convertit avant de multiplier." },
        { valeur: R * mA / 1000, nom: "kΩ non convertis", explication: "1 kΩ = 1 000 Ω : on convertit avant de multiplier." },
        { valeur: R / mA, nom: R_SUR_I.nom, explication: R_SUR_I.explication }
      ]
    };
  });

  return {
    definir: definir, existe: existe, produire: produire, ranger: ranger,
    definirSuite: definirSuite, estSuite: estSuite, produireSuite: produireSuite,
    err: err, plage: plage, net: net, valeurDe: valeurDe,
    un: un, melanger: melanger, DECALAGE: DECALAGE, UNITES: UNITES
  };
})();

  };

  function decimal(maxDec) { var d = entier(1, maxDec); return net(entier(11, 9999) / Math.pow(10, d)); }

<script>/* moteur/generateurs-terminale.js */

    rhoEau: { nom: "ρ de l'eau au lieu du gazole", explication: "C'est le liquide où plonge le corps qui compte : 840 kg/m³ pour le gazole." },
    gOublie: { nom: "g oublié", explication: "ρ × V donne des kg ; × g = 10 N/kg pour des newtons." },

    rangZero: { nom: "Rang compté depuis zéro", explication: "La première année est le rang 1." },

<script>/* moteur/calculette.js */
/* Entrainement · la calculatrice.

   Elle reprend l'application Calculs d'une calculatrice de lycee : une ligne de
   saisie, l'historique au-dessus, Ans, les degres ou les radians, la virgule.

   On tape au clavier ou sur le pave. Priorites usuelles ; ^ associe a droite ;
   -2^2 vaut -4 ; 2π et 3(4+5) sont des produits ; sin(30)² vaut (sin 30)².

   comme au pave ; Entree sur une ligne vide refait le dernier calcul (Ans×1,05, puis
   Entree, Entree… pour iterer). Demande le 6 octobre 2026.
   Aucun eval : l'expression est lue par un petit analyseur recursif.

   monter(conteneur, { memoire: "cle" }) garde l'historique, Ans et l'unite d'angle dans le
   sessionStorage, le temps de l'onglet : c'est ce qui suit l'eleve d'une page du site a
   l'autre. Sans l'option, rien n'est garde. */

  var EFFACER = "⌫", TOUT = "AC", EGAL = "=";
  var TOUCHES = [
    ["sin⁻¹", "sin⁻¹(", "fonction"], ["cos⁻¹", "cos⁻¹(", "fonction"], ["tan⁻¹", "tan⁻¹(", "fonction"], ["π", "π", "fonction"], ["e", "e", "fonction"],
    ["sin", "sin(", "fonction"], ["cos", "cos(", "fonction"], ["tan", "tan(", "fonction"], ["ln", "ln(", "fonction"], ["log", "log(", "fonction"],
    ["√", "√(", "op"], ["x²", "²", "op"], ["xʸ", "^", "op"], ["(", "(", "op"], [")", ")", "op"],
    ["7", "7", "chiffre"], ["8", "8", "chiffre"], ["9", "9", "chiffre"], [EFFACER, EFFACER, "efface"], [TOUT, TOUT, "efface"],
    ["4", "4", "chiffre"], ["5", "5", "chiffre"], ["6", "6", "chiffre"], ["×", "×", "op"], ["÷", "÷", "op"],
    ["1", "1", "chiffre"], ["2", "2", "chiffre"], ["3", "3", "chiffre"], ["+", "+", "op"], ["−", "−", "op"],
    ["0", "0", "chiffre"], [",", ",", "chiffre"], ["×10ⁿ", "×10^", "op"], ["Ans", "Ans", "fonction"], [EGAL, EGAL, "egal"]
  ];
  /* Ce que ⌫ efface d'un coup, plutot que lettre par lettre */
  var BLOCS = ["sin⁻¹(", "cos⁻¹(", "tan⁻¹(", "sin(", "cos(", "tan(", "ln(", "log(", "√(", "×10^", "Ans"];
  /* Apres un resultat, ces touches partent de Ans, comme sur une calculatrice */
  var APRES_ANS = ["+", "−", "×", "÷", "^", "²", "×10^"];
  /* ... et une ligne tapee au clavier qui commence par l'un de ces signes */
  var DEBUT_ANS = /^[+\-−–×*·÷\/^²³]/;

  function el(tag, attrs, enfants) {
    var n = document.createElement(tag);
    for (var k in attrs || {}) {
      if (k === "classe") n.className = attrs[k];
      else if (k === "texte") n.textContent = attrs[k];
      else n.setAttribute(k, attrs[k]);
    }
    (enfants || []).forEach(function (e) { if (e) n.appendChild(e); });
    return n;
  }
  function joli(texte) {
    return texte.replace(/\*/g, "×").replace(/\//g, "÷").replace(/-/g, "−").replace(/\./g, ",");
  }
  /* Ce qu'on recopie dans la saisie : la valeur, ecrite comme on la taperait */
  function brut(x) {
    return String(Number(x.toPrecision(10))).replace("e+", "E").replace("e-", "E−").replace(".", ",");
  }

  function monter(conteneur, options) {
    options = options || {};
    var degres = true, ans = 0, aUnResultat = false, derniere = "", lignes = [];
    var tactile = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
    var bDeg = el("button", { type: "button", "aria-pressed": "true", texte: "Degrés" });
    var bRad = el("button", { type: "button", "aria-pressed": "false", texte: "Radians" });
    var historique = el("ol", { classe: "calc-historique" });
    var ecran = el("div", { classe: "calc-ecran", "aria-live": "polite" }, [historique]);
    var saisie = el("input", { type: "text", classe: "calc-saisie", autocomplete: "off", spellcheck: "false",
      "aria-label": "Calcul à effectuer", placeholder: "2,5×10^3 ÷ (1163×20)" });
    if (tactile) saisie.setAttribute("inputmode", "none");   /* le pave suffit, pas de clavier par-dessus */
    var pave = el("div", { classe: "calc-touches" });

    function angle(deg) {
      degres = deg;
      bDeg.setAttribute("aria-pressed", deg ? "true" : "false");
      bRad.setAttribute("aria-pressed", deg ? "false" : "true");
    }
    bDeg.addEventListener("click", function () { angle(true); });
    bRad.addEventListener("click", function () { angle(false); });

    function inserer(txt) {
      var a = saisie.selectionStart === null ? saisie.value.length : saisie.selectionStart;
      var b = saisie.selectionEnd === null ? a : saisie.selectionEnd;
      if (saisie.value === "" && aUnResultat && APRES_ANS.indexOf(txt) >= 0) { txt = "Ans" + txt; }
      saisie.value = saisie.value.slice(0, a) + txt + saisie.value.slice(b);
      var p = a + txt.length;
      saisie.setSelectionRange(p, p);
    }
    function effacer() {
      var a = saisie.selectionStart, b = saisie.selectionEnd, v = saisie.value;
      if (a !== b) { saisie.value = v.slice(0, a) + v.slice(b); saisie.setSelectionRange(a, a); return; }
      if (a === 0) return;
      var avant = v.slice(0, a), n = 1;
      for (var i = 0; i < BLOCS.length; i++) if (avant.slice(-BLOCS[i].length) === BLOCS[i]) { n = BLOCS[i].length; break; }
      saisie.value = v.slice(0, a - n) + v.slice(a);
      saisie.setSelectionRange(a - n, a - n);
    }
    function garder() {
      if (!options.memoire) return;
      try { sessionStorage.setItem(options.memoire, JSON.stringify({ ans: ans, a: aUnResultat, deg: degres, der: derniere, l: lignes.slice(-40) })); } catch (e) {}
    }
    /* rejoue : une ligne relue dans la memoire de l'onglet, avec la valeur qu'elle avait */
    function ligne(expr, contenu, erreur, rejoue) {
      if (!rejoue) { lignes.push([expr, contenu, erreur ? 1 : 0, ans]); garder(); }
      var bExpr = el("button", { type: "button", classe: "calc-expr", title: "Reprendre ce calcul", texte: joli(expr) });
      bExpr.addEventListener("click", function () { saisie.value = expr; saisie.focus(); });
      var bRes = el("button", { type: "button", classe: "calc-res" + (erreur ? " erreur" : ""), texte: contenu });
      if (!erreur) {
        var valeur = rejoue ? rejoue[3] : ans;
        bRes.title = "Insérer cette valeur";
        bRes.addEventListener("click", function () { inserer(brut(valeur)); saisie.focus(); });
      }
      historique.appendChild(el("li", {}, [bExpr, bRes]));
      while (historique.children.length > 40) historique.removeChild(historique.firstChild);
      ecran.scrollTop = ecran.scrollHeight;
    }
    function calculer() {
      var expr = saisie.value.trim();
      if (!expr) { if (!derniere) return; expr = derniere; }   /* Entree a vide : le dernier calcul, encore */
      if (aUnResultat && DEBUT_ANS.test(expr)) expr = "Ans" + expr;
      derniere = expr;
      var ouvertes = (expr.match(/\(/g) || []).length - (expr.match(/\)/g) || []).length;
      for (; ouvertes > 0; ouvertes--) expr += ")";   /* l'historique montre ce qui a ete calcule */
      try {
        ans = evaluer(expr, degres, ans);
        aUnResultat = true;
        ligne(expr, N.ecrire(ans, 10), false);
        saisie.value = "";
      } catch (err) {
        ligne(expr, MESSAGES[err.message] || MESSAGES.syntaxe, true);
      }
    }

    TOUCHES.forEach(function (t) {
      var b = el("button", { type: "button", classe: t[2], tabindex: "-1", texte: t[0] });
      if (t[0] === EFFACER) b.setAttribute("aria-label", "Effacer");
      if (t[0] === TOUT) b.setAttribute("aria-label", "Tout effacer");
      /* garder le curseur dans la saisie : la touche ne prend pas le focus */
      b.addEventListener("mousedown", function (ev) { ev.preventDefault(); });
      b.addEventListener("click", function () {
        if (t[1] === EGAL) calculer();
        else if (t[1] === EFFACER) effacer();
        else if (t[1] === TOUT) saisie.value = "";
        else inserer(t[1]);
        if (!tactile) saisie.focus();
      });
      pave.appendChild(b);
    });
    /* au clavier, un operateur tape sur une ligne vide apres un resultat devient Ans + operateur */
    saisie.addEventListener("input", function () {
      if (aUnResultat && saisie.value.length === 1 && DEBUT_ANS.test(saisie.value)) {
        saisie.value = "Ans" + saisie.value;
        saisie.setSelectionRange(saisie.value.length, saisie.value.length);
      }
    });
    saisie.addEventListener("keydown", function (ev) {
      if (ev.key === "Enter") { ev.preventDefault(); calculer(); }
      else if (ev.key === "Escape") { saisie.value = ""; }
    });

    /* la memoire de l'onglet, relue a l'ouverture */
    if (options.memoire) {
      try {
        var m = JSON.parse(sessionStorage.getItem(options.memoire) || "null");
        if (m) {
          ans = m.ans || 0; aUnResultat = !!m.a; derniere = m.der || ""; angle(m.deg !== false); lignes = m.l || [];
          lignes.forEach(function (x) { ligne(x[0], x[1], x[2], x); });
        }
      } catch (e) {}
      bDeg.addEventListener("click", garder); bRad.addEventListener("click", garder);
    }
    conteneur.appendChild(el("div", { classe: "calc-angle", role: "group", "aria-label": "Unité d'angle" }, [bDeg, bRad]));
    conteneur.appendChild(ecran);
    conteneur.appendChild(saisie);
    conteneur.appendChild(pave);
    return { focus: function () { if (!tactile) saisie.focus(); } };
  }

  return { monter: monter, evaluer: evaluer };
})();

</script>
<script>/* moteur/jeu.js */
/* Entrainement · le moteur.

   Deux modes, une seule facon de poser une question :
   - le CONTRE-LA-MONTRE des automatismes : des questions fabriquees au hasard, un
     chrono, trois coeurs, une serie qui multiplie les points, un niveau qui monte
     tous les cinq bons coups, et un palier toutes les quinze bonnes reponses
     (+1 000 points, +10 s). Le schema de l'installation qui s'allumait organe par
     organe, puis le scenario de la chaufferie, ont ete retires le 6 octobre 2026 :
     le premier ne changeait jamais, le second ne parlait que d'une chaufferie a une
     classe qui revise aussi l'hydraulique et les conversions ;
   - le PARCOURS d'une lecon : des etapes dans l'ordre, chacune a reussir pour ouvrir
     la suivante, notee d'une a trois etoiles.

   Le contenu vient des fichiers de contenu/, qui appellent Entrainement.classe({...}).
   Rien ne sort de l'appareil : records et etoiles vivent dans le localStorage, sous
   try/catch, et la page fonctionne sans. */
"use strict";
var Entrainement = (function () {
  var N = Nombres, G = Generateurs;
  var CLASSES = [], PROBLEMES = [];
  var racine = null, annonces = null;
  var arretEnCours = null;   /* coupe le chrono de la partie en cours */
  var clavier = null;        /* raccourcis de la question affichee */

  /* ═══════════════════════════════════════════ STOCKAGE : l'appareil, pas l'eleve */
  var CLE = "entrainement";
  var etat = (function () {
    var e = {};
    try { e = JSON.parse(localStorage.getItem(CLE)) || {}; } catch (err) { e = {}; }
    e.records = e.records || {}; e.parcours = e.parcours || {}; e.reglages = e.reglages || {};
    return e;
  })();
  function sauver() { try { localStorage.setItem(CLE, JSON.stringify(etat)); } catch (err) { /* navigation privee */ } }

  /* ═══════════════════════════════════════════ LE CONTENU ET SON CONTROLE */
  function classe(def) {
    PROBLEMES = PROBLEMES.concat(controler(def));
    CLASSES.push(def);
  }
  /* Un fichier de contenu peut completer une classe deja declaree : au BTS, la
     thermique et l'hydraulique vivent chacune dans leur fichier. */
  function completer(id, ajout) {
    var c = trouver(CLASSES, id);
    if (!c) { PROBLEMES.push(id + " : classe à compléter introuvable ; son fichier doit être chargé avant."); return; }
    PROBLEMES = PROBLEMES.concat(controler({ id: id, nom: c.nom, automatismes: ajout.automatismes, lecons: ajout.lecons, formulaire: ajout.formulaire }));
    c.automatismes = (c.automatismes || []).concat(ajout.automatismes || []);
    c.lecons = (c.lecons || []).concat(ajout.lecons || []);
    c.formulaire = (c.formulaire || []).concat(ajout.formulaire || []);
  }
  function controlerQuestion(q, lieu, p) {
    if (q.type === "choix") {
      var justes = (q.choix || []).filter(function (c) { return c.juste; }).length;
      if (justes !== 1) p.push(lieu + " : il faut exactement une réponse juste (" + justes + ").");
      (q.choix || []).forEach(function (c) {
        if (!c.juste && !c.erreur) p.push(lieu + " : la proposition « " + c.texte + " » ne nomme pas son erreur.");
      });
    } else if (q.type === "nombre") {
      if (typeof q.reponse !== "number") p.push(lieu + " : la réponse n'est pas un nombre.");
      if (!q.unite) p.push(lieu + " : l'unité manque.");
    } else p.push(lieu + " : type inconnu (choix, nombre, ou un générateur).");
  }
  function controlerGenerateur(g, lieu, p) {
    if (!g || !G.existe(g.nom)) { p.push(lieu + " : générateur inconnu « " + (g && g.nom) + " »."); return; }
    if (g.nom === "banque") {
      if (!g.questions || !g.questions.length) p.push(lieu + " : banque vide.");
      (g.questions || []).forEach(function (q, k) { controlerQuestion(q, lieu + ", banque n° " + (k + 1), p); });
    }
  }
  function controler(def) {
    var p = [], ou = def.id || "(classe sans id)";
    if (!def.id || !def.nom) p.push(ou + " : il faut un id et un nom.");
    (def.automatismes || []).forEach(function (a) {
      var lieu = ou + " / " + (a.id || "?");
      if (!a.id || !a.titre) p.push(lieu + " : un automatisme sans id ou sans titre.");
      if (!a.generateurs || !a.generateurs.length) p.push(lieu + " : aucun générateur.");
      (a.generateurs || []).forEach(function (g) { controlerGenerateur(g, lieu, p); });
    });
    (def.formulaire || []).forEach(function (g, i) {
      if (!g.titre || !g.sections || !g.sections.length) p.push(ou + " / formulaire, groupe " + (i + 1) + " : un titre et des sections.");
      (g.sections || []).forEach(function (sec, j) {
        if (!sec.titre || !sec.formules || !sec.formules.length) p.push(ou + " / formulaire, « " + g.titre + " », section " + (j + 1) + " : un titre et des formules.");
        (sec.formules || []).forEach(function (f) { if (!Array.isArray(f) || !f[0]) p.push(ou + " / formulaire, « " + sec.titre + " » : une formule s'écrit [formule, unités]."); });
      });
    });
    (def.lecons || []).forEach(function (l) {
      if (!l.etapes || !l.etapes.length) p.push(ou + " / " + l.id + " : aucune étape.");
      (l.etapes || []).forEach(function (e, i) {
        (e.questions || []).forEach(function (q, j) {
          var lieu = ou + " / " + l.id + ", étape " + (i + 1) + ", question " + (j + 1);
          if (q.generateur) controlerGenerateur(q.generateur, lieu, p);
          else controlerQuestion(q, lieu, p);
        });
      });
    });
    return p;
  }
  function trouver(liste, id) {
    for (var i = 0; i < (liste || []).length; i++) if (liste[i].id === id) return liste[i];
    return null;
  }

  /* ═══════════════════════════════════════════ LE DOM */
  function h(tag, attrs, enfants) {
    var n = document.createElement(tag);
    for (var k in attrs || {}) {
      var v = attrs[k];
      if (v === null || v === undefined || v === false) continue;
      if (k === "classe") n.className = v;
      else if (k === "html") n.innerHTML = v;
      else if (k === "texte") n.textContent = v;
      else if (k.slice(0, 2) === "on") n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? "" : v);
    }
    (function ajouter(e) {   /* les listes imbriquees sont aplaties */
      if (e === null || e === undefined || e === false) return;
      if (Array.isArray(e)) { e.forEach(ajouter); return; }
      n.appendChild(typeof e === "string" ? document.createTextNode(e) : e);
    })(enfants);
    return n;
  }
  function vider(n) { while (n.firstChild) n.removeChild(n.firstChild); }
  function afficher(noeuds) {
    clavier = null;
    vider(racine);
    [].concat(noeuds).forEach(function (n) { if (n) racine.appendChild(n); });
    window.scrollTo(0, 0);
  }
  function relancer(n, classeAnim) { n.classList.remove(classeAnim); void n.offsetWidth; n.classList.add(classeAnim); }

  var COEUR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.2l-1.4-1.3C5.4 15.3 2 12.2 2 8.4 2 5.4 4.4 3 7.4 3c1.7 0 3.4.8 4.6 2.1C13.1 3.8 14.8 3 16.6 3 19.6 3 22 5.4 22 8.4c0 3.8-3.4 6.9-8.6 11.5L12 21.2z"/></svg>';
  var ETOILE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.6l2.9 6 6.6.8-4.9 4.6 1.3 6.5L12 17.3l-5.9 3.2 1.3-6.5-4.9-4.6 6.6-.8z"/></svg>';
  function coeurs(n, max, casse) {
    var d = h("span", { classe: "vies", role: "img", "aria-label": n + " cœur" + (n > 1 ? "s" : "") + " sur " + max });
    for (var i = 0; i < max; i++)
      d.appendChild(h("span", { classe: "coeur" + (i < n ? "" : " perdu") + (i === casse ? " casse" : ""), html: COEUR }));
    return d;
  }
  function etoiles(n) {
    var d = h("span", { classe: "etoiles", role: "img", "aria-label": n + " étoile" + (n > 1 ? "s" : "") + " sur 3" });
    for (var i = 0; i < 3; i++) d.appendChild(h("span", { classe: "etoile" + (i < n ? "" : " vide"), html: ETOILE }));
    return d;
  }
  function annoncer(texte) {
    var t = h("div", { classe: "annonce", texte: texte });
    annonces.appendChild(t);
    setTimeout(function () { t.classList.add("part"); }, 1700);
    setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 2200);
  }

  /* ═══════════════════════════════════════════ LE SON : coupe par defaut, une salle de classe */
  var Son = (function () {
    var ctx = null;
    function notes(freqs, duree, forme) {
      if (!etat.reglages.son) return;
      try {
        ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
        var t0 = ctx.currentTime;
        freqs.forEach(function (f, i) {
          var o = ctx.createOscillator(), g = ctx.createGain(), t = t0 + i * duree;
          o.type = forme || "sine"; o.frequency.value = f;
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(0.12, t + 0.01);
          g.gain.exponentialRampToValueAtTime(0.0001, t + duree);
          o.connect(g); g.connect(ctx.destination);
          o.start(t); o.stop(t + duree + 0.02);

    }
    return {
      juste: function () { notes([660, 880], 0.08); },
      faux: function () { notes([220, 165], 0.13, "triangle"); },
      niveau: function () { notes([523, 659, 784, 1047], 0.07); },
      fin: function () { notes([784, 659, 523], 0.12); }
    };
  })();

  /* ═══════════════════════════════════════════ LE FORMULAIRE
     Les formules d'une classe, avec leurs unites, leurs reperes et leurs pieges :
     `formulaire: [ { theme, titre, sections: [ { seance, titre, formules: [[f, unites]],
     reperes: [...], piege } ] } ]`. Il a sa page (#/<classe>/formulaire), imprimable,
     et il s'ouvre aussi dans le panneau d'outils pendant une partie. */
  function sansAccent(t) { return String(t).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[\u00a0\u202f]/g, " "); }
  /* les insecables, poses au rendu : « 3 600 », « 20 K » et « : » ne se coupent pas en fin de ligne */
  function insecables(t) {
    return String(t || "").replace(/(\d) (?=\d{3}(?!\d))/g, "$1\u00a0").replace(/(\d) (?=[A-Za-zµ°%€])/g, "$1\u00a0")
      .replace(/ ([:;!?»])/g, "\u00a0$1").replace(/« /g, "«\u00a0");
  }
  function formulaireDOM(c, compact) {
    var groupes = [];
    parTheme(c, c.formulaire || []).forEach(function (g) { groupes = groupes.concat(g[1]); });
    return groupes.map(function (grp) {
      return h("section", { classe: "form-groupe" }, [
        h(compact ? "h3" : "h2", { classe: "form-titre", texte: grp.titre }),
        grp.sections.map(function (sec) {
          return h("div", { classe: "form-section" }, [
            h("p", { classe: "form-entete" }, [sec.seance ? h("span", { classe: "pastille", texte: sec.seance }) : null, h("span", { html: insecables(sec.titre) })]),
            h("dl", { classe: "form-liste" }, sec.formules.map(function (f) {
              /* la police du texte, pas la mono : son zero barre se lit comme un diametre, et Φ comme un zero */
              return [h("dt", { html: insecables(f[0]) }), h("dd", { html: insecables(f[1]) })];
            })),
            sec.reperes && sec.reperes.length ? h("ul", { classe: "form-reperes" }, sec.reperes.map(function (r) { return h("li", { html: insecables(r) }); })) : null,
            sec.piege ? h("p", { classe: "form-piege" }, [h("span", { classe: "etiquette", texte: "Piège" }), h("span", { html: insecables(sec.piege) })]) : null
          ]);
        })
      ]);
    });
  }
  /* un champ qui ne garde que les sections ou le mot apparait, accents ignores */
  function formulaireFiltre(c, compact) {
    var contenu = h("div", { classe: "form-contenu" }, formulaireDOM(c, compact));
    var champ = h("input", { type: "search", classe: "form-filtre", /* `chercher:` de la classe : quatre mots de son formulaire, pour montrer ce qu'on peut taper */
      placeholder: "Chercher : " + (c.chercher || "un mot, une unité") + "…", "aria-label": "Chercher une formule" });
    champ.addEventListener("input", function () {
      var q = sansAccent(champ.value.trim());
      [].forEach.call(contenu.querySelectorAll(".form-section"), function (x) { x.hidden = !!q && sansAccent(x.textContent).indexOf(q) < 0; });
      [].forEach.call(contenu.querySelectorAll(".form-groupe"), function (x) { x.hidden = !x.querySelector(".form-section:not([hidden])"); });
    });
    return [champ, contenu];
  }

  /* ═══════════════════════════════════════════ LE PANNEAU D'OUTILS
     A droite de la question, par-dessus sur telephone : la calculatrice du depot
     (moteur/calculette.js, pour les classes qui ont `calculatrice: true`) et le
     formulaire (pour celles qui en ont un). Un bouton par outil dans la barre des
     parties et des etapes ; le panneau est garde d'une question a l'autre, l'historique
     de la calculatrice et Ans restent. L'emulateur NumWorks a ete essaye puis ecarte le

  /* ═══════════════════════════════════════════ POSER UNE QUESTION

  /* L'ecriture d'une valeur proposee ou attendue. En decimal plein (CAP, seconde) :
