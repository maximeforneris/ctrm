    ]);

    function plus(fn, ms) { minuteries.push(setTimeout(fn, ms)); }
    function multiplicateur() { return Math.min(4, 1 + Math.floor(J.serie / 3)); }
    function dessinerVies(casse) { vider(elVies); elVies.appendChild(coeurs(J.vies, viesMax, casse)); }
    function dessinerCompteurs() {
      elScore.textContent = N.ecrire(J.score, 9);
      var m = multiplicateur();
      if (elMult.textContent !== "×" + m) { elMult.textContent = "×" + m; elMult.classList.toggle("x1", m === 1); relancer(elMult, "pulse"); }
      elNiveau.textContent = "Niveau " + J.niveau;
      elSerie.textContent = "Série " + J.serie;
    }
    function lireRestant() { return enPause ? restant : restant - (performance.now() - depuis); }
    function suspendre() { if (enPause) return; restant = lireRestant(); enPause = true; }
    function reprendre() { if (!enPause || fini) return; depuis = performance.now(); enPause = false; }
    /* Le temps se lit sur l'horloge, pas au nombre de battements : un onglet en
       arriere-plan ralentit les minuteries, la partie n'en dure pas plus. */
    function battre() {
      var r = Math.max(0, lireRestant()), s = Math.ceil(r / 1000);
      elTemps.textContent = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
      elJauge.style.transform = "scaleX(" + (r / duree).toFixed(4) + ")";
      blocTemps.classList.toggle("urgent", r < 10000);
      if (r <= 0 && !fini) terminer("temps");
    }
    function flotter(texte) {
      var f = h("span", { classe: "flotte mono", texte: texte });
      blocScore.appendChild(f);
      plus(function () { if (f.parentNode) f.parentNode.removeChild(f); }, 950);
    }

    function poser() {
      var q = G.produire(G.un(a.generateurs), J.niveau);
      var mode = saisie === "mixte" ? (J.niveau >= 3 ? "libre" : "choix") : saisie;
      poserQuestion(zone, q, mode, function (res, zoneRetour) {
        suspendre();
        J.total++;
        if (res.juste) {
          J.serie++; J.bonnes++; J.meilleure = Math.max(J.meilleure, J.serie);
          var gain = 100 * J.niveau * multiplicateur();
          J.score += gain;
          restant = Math.min(duree, restant + bonus);
          Son.juste(); flotter("+" + gain);
          montrerRetour(zoneRetour, q, res, null, "Juste. +" + gain);
          var avant = J.niveau;
          J.niveau = Math.min(3, 1 + Math.floor(J.bonnes / parNiveau));
          if (J.niveau > avant) {
            Son.niveau();
            annoncer(J.niveau === 3 && saisie === "mixte" ? "Niveau 3 · à vous d'écrire la réponse" : "Niveau " + J.niveau);
          }
          if (parPalier && J.bonnes % parPalier === 0) {
            J.paliers++; J.score += 1000;
            restant = Math.min(duree, restant + 10000);
            annoncer(J.bonnes + " bonnes réponses · +1 000 · +10 s");
          }
          dessinerCompteurs(); battre();
          plus(suivante, 750);
        } else {
          J.serie = 0; J.vies--;
          noterErreur(J.erreurs, res.erreur, q);
          Son.faux();
          dessinerVies(J.vies); dessinerCompteurs();
          montrerRetour(zoneRetour, q, res, function () { if (J.vies <= 0) terminer("vies"); else suivante(); });
        }
      });
    }
    function suivante() { if (fini) return; poser(); reprendre(); }

    function arreter() {
      fini = true; clearInterval(tic);
      minuteries.forEach(clearTimeout); minuteries = [];
    }
    function terminer(raison) {
      if (fini) return;
      arreter(); arretEnCours = null;
      Son.fin();
      var cle = c.id + "/" + a.id, ancien = etat.records[cle];
      var nouveau = J.score > 0 && (!ancien || J.score > ancien.score);
      if (nouveau) { etat.records[cle] = { score: J.score, date: new Date().toISOString().slice(0, 10) }; sauver(); }
      var rg = rang(c, J.score);
      var stats = [
        ["Bonnes réponses", J.bonnes + " / " + J.total],
        ["Précision", J.total ? Math.round(100 * J.bonnes / J.total) + " %" : "—"],
        ["Meilleure série", String(J.meilleure)],
        ["Niveau atteint", String(J.niveau)]
      ];
      if (parPalier) stats.push(["Paliers de " + parPalier, String(J.paliers)]);
      var rejouer = h("button", { type: "button", classe: "bouton principal" }, "Rejouer");
      rejouer.addEventListener("click", function () { demarrerChrono(c, a); });
      afficher([
        barre({ href: "#/" + c.id, texte: "L'entraînement" }),
        h("div", { classe: "fin" }, [
          h("p", { classe: "surtitre", texte: (raison === "temps" ? "Temps écoulé" : "Plus de cœurs") + " · " + a.titre }),
          h("h1", { texte: rg.actuel.titre }),
          h("p", { classe: "score-final" }, [h("span", { classe: "mono", texte: N.ecrire(J.score, 9) }), h("span", { classe: "unite-score", texte: " points" })]),
          h("p", { classe: nouveau ? "record" : "detail", texte: nouveau ? "Nouveau record sur cet appareil."
            : ancien ? "Record : " + N.ecrire(ancien.score, 9) + " points." : "Pas encore de record : une bonne réponse suffit." }),
          rg.suivant ? h("p", { classe: "detail", texte: "Prochain cap : " + rg.suivant.titre + ", à " + N.ecrire(rg.suivant.points, 9) + " points." }) : null,
          h("div", { classe: "stats" }, stats.map(function (s) {
            return h("div", { classe: "stat" }, [h("span", { classe: "hud-nom", texte: s[0] }), h("span", { classe: "val mono", texte: s[1] })]);
          })),
          listeErreurs(J.erreurs),
          h("div", { classe: "rangee" }, [rejouer, h("a", { classe: "bouton", href: "#/" + c.id }, "Autres exercices")])
        ])
      ]);
      setTimeout(function () { rejouer.focus(); }, 40);
    }

    arretEnCours = arreter;
    dessinerVies(); dessinerCompteurs(); battre();
    tic = setInterval(battre, 100);
    suivante();
  }

  /* ═══════════════════════════════════════════ LA PAGE DU FORMULAIRE */
  function pageFormulaire(c) {
    document.title = "Formulaire · " + c.nom;
    var imprimer = h("button", { type: "button", classe: "bouton" }, "Imprimer");
    imprimer.addEventListener("click", function () { window.print(); });
    var parts = formulaireFiltre(c, false);
    /* un sommaire en boutons : une ancre « # » changerait la route */
    /* le libelle de la seance, et son titre en plus quand deux sections le partagent */
    var secs = [].slice.call(parts[1].querySelectorAll(".form-section"));
    var libelles = secs.map(function (sec) { var p = sec.querySelector(".form-entete .pastille"); return p ? p.textContent : ""; });
    var sommaire = h("div", { classe: "form-sommaire" }, secs.map(function (sec, i) {
      var titre = sec.querySelector(".form-entete span:last-child").textContent, l = libelles[i];
      var double = l && libelles.filter(function (x) { return x === l; }).length > 1;
      var b = h("button", { type: "button", classe: "pastille" }, !l ? titre : double ? l + " · " + titre : l);
      b.addEventListener("click", function () { sec.scrollIntoView({ behavior: "smooth", block: "start" }); });
      return b;
    }));
    afficher([
      /* la calculatrice seulement : le formulaire est deja la page */
      barre({ href: "#/" + c.id, texte: "L'entraînement" }, c.calculatrice ? { calculatrice: true, formulaire: false, classe: c } : null),
      entete(c.nom, "Formulaire", "Les formules à connaître, avec leurs unités, les repères utiles et le piège qui revient."),
      h("div", { classe: "form-actions rangee" }, [parts[0], imprimer]),
      sommaire,
      parts[1],
      pied()
    ]);
  }

  /* ═══════════════════════════════════════════ LE PARCOURS D'UNE LECON */
  function developper(liste) {
    var sortie = [];
    liste.forEach(function (q) {
      if (q.generateur && G.estSuite(q.generateur.nom)) {
        G.produireSuite(q.generateur).forEach(function (g) { g.saisie = q.saisie || "libre"; sortie.push(g); });
      } else if (q.generateur) {
        for (var r = 0; r < (q.repeter || 1); r++) {
          var g = G.produire(q.generateur, q.niveau || 1);
          g.saisie = q.saisie || "choix";
          sortie.push(g);
        }
      } else if (q.type === "nombre") {
        var copie = {};
        for (var k in q) copie[k] = q[k];
        copie.tolerance = q.tolerance || 0.01;
        copie.erreurs = G.ranger(q.reponse, q.erreurs || []);
        copie.saisie = q.saisie || "libre";
        sortie.push(copie);
      } else sortie.push(q);
    });
    return sortie;
  }
  function compter(e) {
    return e.questions.reduce(function (s, q) {
      if (q.generateur && G.estSuite(q.generateur.nom)) return s + G.produireSuite(q.generateur).length;
      return s + (q.generateur ? (q.repeter || 1) : 1);
    }, 0);
  }
  function etoilesDe(c, l) { return etat.parcours[c.id + "/" + l.id] || []; }

  function pageLecon(c, l) {
    document.title = l.titre + " · " + c.nom;
    var st = etoilesDe(c, l);
    afficher([
      barre({ href: "#/" + c.id, texte: "L'entraînement" }),
      entete(l.seance ? "Leçon · " + l.seance : "Leçon", l.titre, l.intro),
      h("ol", { classe: "parcours" }, l.etapes.map(function (e, i) {
        var ouverte = i === 0 || st[i - 1] > 0, n = st[i] || 0;
        var contenu = [
          h("span", { classe: "noeud-etape mono", texte: String(i + 1) }),
          h("span", { classe: "etape-texte" }, [
            h("span", { classe: "etape-titre", texte: e.titre }),
            e.objectif ? h("span", { classe: "detail", texte: e.objectif }) : null,
            h("span", { classe: "etape-pied" }, [
              h("span", { classe: "detail", texte: pluriel(compter(e), "question") }),
              n ? etoiles(n) : h("span", { classe: "pastille", texte: ouverte ? "À faire" : "Fermée" })
            ])
          ])
        ];
        return h("li", { classe: "etape " + (n ? "faite" : ouverte ? "ouverte" : "fermee") }, [
          ouverte ? h("a", { classe: "etape-lien", href: "#/" + c.id + "/lecon/" + l.id + "/" + (i + 1) }, contenu)
                  : h("div", { classe: "etape-lien", "aria-disabled": "true" }, contenu)
        ]);
      })),
      h("p", { classe: "detail", texte: "Trois étoiles : aucune faute. Deux : une faute. Une : deux fautes. Trois cœurs perdus : l'étape est à reprendre." }),
      pied()
    ]);
  }

  function lancerEtape(c, l, i) {
    var e = l.etapes[i], cle = c.id + "/" + l.id, st = etoilesDe(c, l);
    if (!e || (i > 0 && !(st[i - 1] > 0))) { location.hash = "#/" + c.id + "/lecon/" + l.id; return; }
    document.title = e.titre + " · " + l.titre;
    var qs = developper(e.questions), viesMax = e.vies || 3;
    var S = { vies: viesMax, k: 0, fautes: 0, resultats: [], erreurs: {} };
    var minuteries = [];
    var elVies = h("span"), elPas = h("ol", { classe: "pas", "aria-label": "Avancement de l'étape" });
    var zone = h("div", { classe: "zone-question" });
    var calc = [e.calculatrice, l.calculatrice, c.calculatrice].filter(function (x) { return x !== undefined; })[0];
    afficher([
      barre({ href: "#/" + c.id + "/lecon/" + l.id, texte: l.titre }, outilsDe(c, calc)),
      h("div", { classe: "titre-jeu" }, [h("div", {}, [
        h("p", { classe: "surtitre", texte: "Étape " + (i + 1) + " sur " + l.etapes.length }),
        h("h1", { texte: e.titre })
      ])]),
      h("div", { classe: "hud hud-etape" }, [
        h("div", { classe: "hud-bloc" }, [h("span", { classe: "hud-nom", texte: "Cœurs" }), elVies]),
        h("div", { classe: "hud-bloc" }, [h("span", { classe: "hud-nom", texte: "Question" }), elPas])
      ]),
      zone
    ]);
    function dessiner(casse) {
      vider(elVies); elVies.appendChild(coeurs(S.vies, viesMax, casse));
      vider(elPas);
      qs.forEach(function (q, j) {
        elPas.appendChild(h("li", { classe: j < S.k || S.resultats[j] !== undefined ? (S.resultats[j] ? "ok" : "ko") : (j === S.k ? "courant" : "") }));
      });
    }
    function poser() {
      var q = qs[S.k];
      poserQuestion(zone, q, q.type === "choix" ? "choix" : q.saisie, function (res, zoneRetour) {
        S.resultats[S.k] = res.juste;
        if (res.juste) {
          Son.juste(); dessiner();
          montrerRetour(zoneRetour, q, res);
          minuteries.push(setTimeout(suivante, 900));
        } else {
          S.fautes++; S.vies--;
          noterErreur(S.erreurs, res.erreur, q);
          Son.faux(); dessiner(S.vies);
          montrerRetour(zoneRetour, q, res, function () { if (S.vies <= 0) finir(false); else suivante(); });
        }
      });
    }
    function suivante() { S.k++; if (S.k >= qs.length) finir(true); else { dessiner(); poser(); } }
    function finir(reussi) {
      arretEnCours = null;
      var n = reussi ? Math.max(1, 3 - S.fautes) : 0;
      if (n > (st[i] || 0)) { st[i] = n; etat.parcours[cle] = st; sauver(); }
      Son.fin();
      var refaire = h("button", { type: "button", classe: "bouton" + (reussi ? "" : " principal") }, "Refaire l'étape");
      refaire.addEventListener("click", function () { lancerEtape(c, l, i); });
      var apres = reussi && l.etapes[i + 1]
        ? h("a", { classe: "bouton principal", href: "#/" + c.id + "/lecon/" + l.id + "/" + (i + 2) }, "Étape suivante")
        : h("a", { classe: "bouton" + (reussi ? " principal" : ""), href: "#/" + c.id + "/lecon/" + l.id }, "Le parcours");
      afficher([
        barre({ href: "#/" + c.id + "/lecon/" + l.id, texte: l.titre }),
        h("div", { classe: "fin" }, [
          h("p", { classe: "surtitre", texte: "Étape " + (i + 1) + " · " + e.titre }),
          h("h1", { texte: reussi ? (l.etapes[i + 1] ? "Étape réussie" : "Leçon terminée") : "Étape à reprendre" }),
          reussi ? etoiles(n) : h("p", { classe: "detail", texte: "Plus de cœurs. Relisez ce qui a coincé, puis recommencez : les nombres changent." }),
          h("div", { classe: "stats" }, [
            h("div", { classe: "stat" }, [h("span", { classe: "hud-nom", texte: "Bonnes réponses" }),
              h("span", { classe: "val mono", texte: S.resultats.filter(Boolean).length + " / " + qs.length })]),
            h("div", { classe: "stat" }, [h("span", { classe: "hud-nom", texte: "Fautes" }), h("span", { classe: "val mono", texte: String(S.fautes) })])
          ]),
          listeErreurs(S.erreurs),
          h("div", { classe: "rangee" }, [apres, refaire, reussi && l.etapes[i + 1] ? h("a", { classe: "bouton", href: "#/" + c.id + "/lecon/" + l.id }, "Le parcours") : null])
        ])
      ]);
    }
    arretEnCours = function () { minuteries.forEach(clearTimeout); };
    dessiner(); poser();
  }

  /* ═══════════════════════════════════════════ CONTROLE : index.html?controle
     Fait tourner chaque generateur trois cents fois par niveau et compte les defauts :
     reponse qui n'est pas un nombre, moins de trois erreurs distinctes, erreur qui
     tomberait juste. Ne montre aucune reponse. */
  function controle() {
    var lignes = [];
    CLASSES.forEach(function (c) {
      var specs = [];
      (c.automatismes || []).forEach(function (a) {
        a.generateurs.forEach(function (g) { specs.push({ ou: c.id + " / " + a.id, spec: g, niveaux: [1, 2, 3] }); });
      });
      (c.lecons || []).forEach(function (l) {
        l.etapes.forEach(function (e, i) {
          e.questions.forEach(function (q) {
            if (q.generateur) specs.push({ ou: c.id + " / " + l.id + " / étape " + (i + 1), spec: q.generateur, niveaux: [q.niveau || 1] });
          });
        });
      });
      specs.forEach(function (s) {
        var suite = G.estSuite(s.spec.nom), niveaux = suite || s.spec.nom === "banque" ? [1] : s.niveaux;
        niveaux.forEach(function (niv) {
          var defauts = {}, exemple = "";
          for (var t = 0; t < 300; t++) {
            var qs;
            try { qs = suite ? G.produireSuite(s.spec) : [G.produire(s.spec, niv)]; }
            catch (err) { defauts["plantage : " + err.message] = 1; break; }
            qs.forEach(function (q) {
              if (!exemple) exemple = (q.contexte || "").replace(/<[^>]+>/g, " ") + " " + q.enonce.replace(/<[^>]+>/g, "") + " → " + (q.unite || "choix");
              if (q.type === "choix") return;
              if (!isFinite(q.reponse)) defauts["réponse qui n'est pas un nombre"] = 1;
              if (q.erreurs.length < 3) defauts["moins de trois erreurs distinctes"] = 1;
              if (q.erreurs.some(function (e) { return N.proche(e.valeur, q.reponse, q.tolerance); })) defauts["une erreur tombe juste"] = 1;
            });
          }
          lignes.push({ ou: s.ou, nom: s.spec.nom, niveau: suite ? "suite" : s.spec.nom === "banque" ? "—" : niv, defauts: Object.keys(defauts), exemple: exemple });
        });
      });
    });
    var ko = lignes.filter(function (l) { return l.defauts.length; }).length;
    afficher([
      barre({ href: "./", texte: "L'entraînement" }),
      entete("Contrôle du contenu", ko ? pluriel(ko, "défaut") : "Aucun défaut",
        pluriel(lignes.length, "générateur") + " × 300 questions, et " + pluriel(PROBLEMES.length, "point") + " de contenu à revoir."),
      PROBLEMES.length ? h("ul", { classe: "problemes" }, PROBLEMES.map(function (p) { return h("li", { texte: p }); })) : null,
      h("div", { classe: "table-defile" }, h("table", { classe: "controle" }, [
        h("thead", {}, h("tr", {}, ["Où", "Générateur", "Niveau", "État", "Exemple d'énoncé"].map(function (t) { return h("th", { texte: t }); }))),
        h("tbody", {}, lignes.map(function (l) {
          return h("tr", { classe: l.defauts.length ? "ko" : "" }, [
            h("td", { texte: l.ou }), h("td", { classe: "mono", texte: l.nom }), h("td", { classe: "mono", texte: String(l.niveau) }),
            h("td", { texte: l.defauts.length ? l.defauts.join(" ; ") : "bon" }), h("td", { classe: "detail", texte: l.exemple })
          ]);
        }))
      ]))
    ]);
  }

  /* ═══════════════════════════════════════════ LES ROUTES
     #/ · #/<classe> · #/<classe>/chrono/<automatisme> · #/<classe>/lecon/<lecon>[/<etape>]
     Une adresse par ecran : le bouton retour du navigateur marche, et une page du
     site de classe peut renvoyer droit sur un automatisme. */
  function demarrerChrono(c, a) { if (arretEnCours) arretEnCours(); arretEnCours = null; lancerChrono(c, a); }
  function route() {
    if (arretEnCours) { arretEnCours(); arretEnCours = null; }
    var p = decodeURIComponent(location.hash.replace(/^#\/?/, "")).split("/").filter(Boolean);
    var c = p.length ? trouver(CLASSES, p[0]) : null;
    if (!c) return CLASSES.length === 1 ? pageClasse(CLASSES[0]) : accueil();
    if (p[1] === "formulaire" && c.formulaire && c.formulaire.length) return pageFormulaire(c);
    if (p[1] === "chrono") { var a = trouver(c.automatismes, p[2]); return a ? lancerChrono(c, a) : pageClasse(c); }
    if (p[1] === "lecon") {
      var l = trouver(c.lecons, p[2]);
      if (!l) return pageClasse(c);
      return p[3] ? lancerEtape(c, l, parseInt(p[3], 10) - 1) : pageLecon(c, l);
    }
    pageClasse(c);
  }

  function demarrer() {
    racine = document.getElementById("app");
    annonces = document.getElementById("annonces");
    document.addEventListener("keydown", function (ev) {
      if (!clavier || ev.ctrlKey || ev.metaKey || ev.altKey) return;
      if (ev.target && /^(INPUT|TEXTAREA)$/.test(ev.target.tagName)) return;
      clavier(ev);
    });
    if (/[?&]controle\b/.test(location.search)) return controle();
    window.addEventListener("hashchange", route);
    route();
  }

  return { classe: classe, completer: completer, demarrer: demarrer };
})();

</script>

<script>/* contenu/term-ctrm.js */
/* Entrainement · Tle Bac Pro CTRM (maths groupement B, physique-chimie groupement 6).
   Ce qui est ouvert sur le site de la classe au 6 octobre 2026, et rien d'autre : les
   sequences 1 a 3 (le modele de consommation, la batterie, l'arrimage), les quatre
   salves de debut d'heure (CHRONO-1 a 4) et les fiches d'aide 01 a 04. Les sequences 4
   a 12 sont tenues par `avancement: S3` : elles entreront ici quand elles ouvriront.

   En terminale, l'epreuve est l'echeance : la lecon « Au format du CCF » la nomme, comme
   MODEL-1 et BATT-5 (cadrage tranche le 22 septembre 2026). Les questions de cours sont
   ecrites depuis les pages MODEL, BATT et ARRIM, chaque mauvaise reponse nommee. La
   classe n'a pas de QCM Pronote. */
(function () {
  function qc(enonce, juste, faux, methode) {
    return {
      type: "choix", enonce: enonce, methode: methode,
      choix: [{ texte: juste, juste: true }].concat(faux.map(function (f) {
        return { texte: f[0], erreur: f[1], explication: f[2] };
      }))
    };
